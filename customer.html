<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลูกค้า — ร้านชาแมกไม้</title>
  <style>
    :root{--brown-900:#3E2A1E;--brown-800:#5C4030;--cream-100:#FBF5E9;--cream-050:#FFFCF6;--paper:#fff;--amber:#E28A33;--amber-dark:#C96F1E;--jade:#3E8E63;--line:#E7DCC9;--ink:#2C2118;--ink-soft:#8A7A67;}
    *{box-sizing:border-box;} body{margin:0;font-family:'Sarabun',sans-serif;background:var(--cream-100);color:var(--ink);} a{color:inherit;text-decoration:none;}
    .page{max-width:1100px;margin:0 auto;padding:0 0 20px;}
    .topbar{background:linear-gradient(135deg,var(--brown-700),var(--brown-900));color:#fff;border-radius:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:none;margin:0 0 18px;}
    .topbar .brand h1{margin:0;font-size:20px;font-family:'Noto Serif Thai',serif;} .topbar .brand p{margin:2px 0 0;font-size:13px;opacity:.9;}
    .nav{display:flex;gap:8px;flex-wrap:wrap;}
    .nav a{background:rgba(255,255,255,.16);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;}
    .layout{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-top:18px;}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;}
    .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--cream-050);margin-bottom:12px;}
    .cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;} .cats button{border:none;border-radius:999px;padding:8px 13px;background:#f5efe4;color:var(--brown-800);font-weight:700;}
    .cats button.active{background:var(--brown-800);color:#fff;}
    .menu-list{display:flex;flex-direction:column;gap:10px;}
    .item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;}
    .item .name{font-weight:700;} .item .price{color:var(--amber-dark);font-weight:700;margin-top:3px;}
    .add{background:var(--amber);border:none;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:700;color:#2C1B0E;}
    .cart h2{margin:0 0 8px;font-size:18px;} .cart-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);} .cart-item:last-child{border-bottom:none;} .cart-total{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;font-size:16px;} .btn{border:none;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--amber);color:#2C1B0E;width:100%;margin-top:10px;}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--jade);color:#fff;font-size:12px;font-weight:700;}
    @media (max-width:800px){.layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <h1>ลูกค้า</h1>
        <p>สั่งเมนูและติดตามสถานะออเดอร์</p>
      </div>
      <div class="nav">
        <a href="index.html">กลับหน้าเลือก</a>
      </div>
    </div>
    <div class="layout">
      <div class="panel">
        <div class="search"><span>🔍</span><input id="search" placeholder="ค้นหาเมนู..." style="border:none;outline:none;background:transparent;flex:1;font-size:14px;" /></div>
        <div class="cats" id="cats"></div>
        <div class="menu-list" id="menuList"></div>
      </div>
      <div class="panel cart">
        <h2>ตะกร้า</h2>
        <div id="cartList"></div>
        <div class="cart-total"><span>รวม</span><span id="cartTotal">฿0</span></div>
        <button class="btn" onclick="submitOrder()">ยืนยันคำสั่งซื้อ</button>
      </div>
    </div>
  </div>
  <script>
    const menu = {
      'เครื่องดื่ม': [{name:'ชาไทย',price:30},{name:'ชาเขียว',price:30},{name:'ไมโล',price:30}],
      'อาหาร': [{name:'ข้าวไข่เจียวไก่สับ',price:35},{name:'มาม่าต้มยำน้ำข้น',price:50},{name:'ข้าวไก่ทอดเทอริยากิ',price:50}],
      'ของทานเล่น': [{name:'กรอบโปะ',price:30},{name:'เฟรนช์ฟราย',price:35},{name:'นักเก็ต',price:40}],
    };
    const state = {cat:'เครื่องดื่ม', search:'', cart:[]};
    function money(n){return '฿' + n.toLocaleString('th-TH');}
    function renderCats(){
      document.getElementById('cats').innerHTML = Object.keys(menu).map(k=>`<button class="${state.cat===k?'active':''}" onclick="setCat('${k}')">${k}</button>`).join('');
    }
    function setCat(cat){state.cat=cat; renderMenu();}
    function renderMenu(){
      const items = menu[state.cat].filter(i=>i.name.includes(state.search));
      document.getElementById('menuList').innerHTML = items.map(i=>`<div class="item"><div><div class="name">${i.name}</div><div class="price">${money(i.price)}</div></div><button class="add" onclick="addToCart('${i.name}',${i.price})">+</button></div>`).join('');
    }
    function addToCart(name,price){state.cart.push({name,price}); renderCart();}
    function renderCart(){
      const total = state.cart.reduce((s,i)=>s+i.price,0);
      document.getElementById('cartTotal').textContent = money(total);
      document.getElementById('cartList').innerHTML = state.cart.length ? state.cart.map((i,idx)=>`<div class="cart-item"><div>${i.name}</div><div>${money(i.price)} <span onclick="removeItem(${idx})" style="color:var(--amber-dark);cursor:pointer;margin-left:8px;">ลบ</span></div></div>`).join('') : '<div style="color:var(--ink-soft);">ยังไม่มีรายการ</div>';
    }
    function removeItem(idx){state.cart.splice(idx,1); renderCart();}
    function submitOrder(){ if(!state.cart.length) return; alert('ส่งคำสั่งซื้อเรียบร้อยแล้ว'); state.cart=[]; renderCart(); }
    document.getElementById('search').addEventListener('input', (e)=>{state.search=e.target.value; renderMenu();});
    renderCats(); renderMenu(); renderCart();
  </script>
</body>
</html>
