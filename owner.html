<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เจ้าของร้าน — ร้านชาแมกไม้</title>
  <style>
    :root{--brown-900:#3E2A1E;--brown-800:#5C4030;--cream-100:#FBF5E9;--paper:#fff;--amber:#E28A33;--jade:#3E8E63;--line:#E7DCC9;--ink:#2C2118;--ink-soft:#8A7A67;}
    *{box-sizing:border-box;} body{margin:0;font-family:'Sarabun',sans-serif;background:var(--cream-100);color:var(--ink);} a{color:inherit;text-decoration:none;}
    .page{max-width:1200px;margin:0 auto;padding:0 0 20px;}
    .topbar{background:var(--brown-900);color:#fff;border-radius:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:none;margin:0 0 18px;}
    .topbar h1{margin:0;font-size:22px;font-family:'Noto Serif Thai',serif;}
    .topbar p{margin:3px 0 0;font-size:13px;opacity:.9;}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;}
    .kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;}
    .kpi .value{font-size:24px;font-weight:700;color:var(--brown-900);} .kpi .label{font-size:13px;color:var(--ink-soft);margin-top:4px;}
    .layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px;}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;}
    table{width:100%;border-collapse:collapse;} th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;} th{color:var(--ink-soft);font-size:12px;text-transform:uppercase;}
    .toggle{width:42px;height:24px;border-radius:999px;background:#ddd;position:relative;display:inline-block;cursor:pointer;} .toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;} .toggle.on{background:var(--jade);} .toggle.on::after{left:20px;}
    @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);} .layout{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>เจ้าของร้าน</h1>
        <p>ภาพรวมยอดขายและการจัดการเมนู</p>
      </div>
      <a href="index.html" style="background:rgba(255,255,255,.16);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;">กลับหน้าเลือก</a>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="value">฿3,200</div><div class="label">ยอดขายวันนี้</div></div>
      <div class="kpi"><div class="value">24</div><div class="label">จำนวนออเดอร์</div></div>
      <div class="kpi"><div class="value">฿1,200</div><div class="label">ยอด QR</div></div>
      <div class="kpi"><div class="value">฿2,000</div><div class="label">ยอดเงินสด</div></div>
    </div>
    <div class="layout">
      <div class="panel">
        <h3 style="margin-top:0;">เมนูที่เปิดขาย</h3>
        <table>
          <thead><tr><th>เมนู</th><th>ราคา</th><th>สถานะ</th></tr></thead>
          <tbody>
            <tr><td>ชาไทย</td><td>฿30</td><td><span class="toggle on"></span></td></tr>
            <tr><td>มาม่าต้มยำน้ำข้น</td><td>฿50</td><td><span class="toggle on"></span></td></tr>
            <tr><td>หมูทอด</td><td>฿45</td><td><span class="toggle"></span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel">
        <h3 style="margin-top:0;">พนักงาน</h3>
        <table>
          <thead><tr><th>ชื่อ</th><th>บทบาท</th><th>สิทธิ์</th></tr></thead>
          <tbody>
            <tr><td>ใจดี ดีใจ</td><td>เจ้าของร้าน</td><td>Admin</td></tr>
            <tr><td>สุพพัญญู</td><td>แคชเชียร์</td><td>Staff</td></tr>
            <tr><td>ณัฐพล</td><td>ครัว</td><td>Staff</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
