<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ร้านชาแมกไม้ — เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-900:#3B2A1B; --brown-800:#5B4530; --brown-700:#6E5237;
    --cream-100:#F3F4F6; --cream-050:#FFFFFF; --paper:#FFFFFF;
    --amber:#D97706; --amber-dark:#B45F04; --amber-bg:#FEF3C7;
    --jade:#16A34A; --jade-bg:#DCFCE7;
    --clay:#DC2626; --clay-bg:#FEE2E2;
    --ink:#111827; --ink-soft:#6B7280; --line:#E5E7EB;
    --navy-900:#111827; --navy-800:#1F2937; --navy-700:#374151;
    font-family:'Sarabun', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream-100);color:var(--ink);min-height:100vh;}
  body{-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Sarabun', sans-serif;font-weight:700;}
  button{font-family:inherit;cursor:pointer;}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .stage{flex:1;padding:0;display:flex;justify-content:center;}
  .stage-inner{width:100%;max-width:100%;}

  /* ===== Desktop app titlebar ===== */
  .app-window{background:var(--paper);overflow:hidden;display:flex;flex-direction:column;min-height:100vh;}
  .app-titlebar{background:var(--navy-800);color:#F3F4F6;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
  .app-titlebar .tleft{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;}
  .app-titlebar .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);}
  .app-titlebar .online{font-size:11px;background:var(--jade);color:#fff;padding:3px 9px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .app-titlebar .online::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;}
  
  .app-flex{display:flex;flex:1;justify-content:center;align-items:center;background:var(--cream-100);padding:20px;}

  /* ===== Login Card Design ===== */
  .login-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:36px 32px;
    width:100%;
    max-width:400px;
    box-shadow:0 10px 25px -5px rgba(60,40,20,0.1);
  }
  .brand-header{text-align:center;margin-bottom:28px;}
  .brand-logo{
    width:54px;
    height:54px;
    background:var(--amber-bg);
    color:var(--amber);
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    margin:0 auto 12px;
  }
  .brand-title{font-size:18px;color:var(--brown-900);margin:0;}
  .brand-subtitle{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  /* ===== Form Styling ===== */
  .form-group{
    margin-bottom:18px;
    text-align:left;
  }
  .form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--brown-800);
    margin-bottom:6px;
  }
  .form-input{
    width:100%;
    padding:12px 16px;
    border:1px solid var(--line);
    border-radius:12px;
    font-size:14px;
    font-family:inherit;
    background:var(--cream-100);
    color:var(--navy-900);
    transition:all 0.15s ease;
  }
  .form-input:focus{
    outline:none;
    border-color:var(--amber);
    background:var(--cream-050);
    box-shadow:0 0 0 3px rgba(217, 119, 6, 0.15);
  }

  .btn{
    border:none;
    border-radius:12px;
    padding:14px 16px;
    font-weight:700;
    font-size:14.5px;
    transition:transform .08s ease;
    width:100%;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber);color:#fff;}
  .btn-primary:hover{background:var(--amber-dark);}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--brown-900);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:0 10px 25px -10px rgba(0,0,0,0.4);z-index:200;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
let state = {
  toast: null
};

/* ============================= CONSTANTS & CREDENTIALS ============================= */
// ข้อมูลพนักงานจำลองพร้อมระบบตรวจจับบทบาทหน้าที่โดยอัตโนมัติ
const USERS = [
  { username: 'owner', password: '3333', role: 'owner' },
  { username: 'cashier', password: '1111', role: 'cashier' },
  { username: 'kitchen', password: '2222', role: 'kitchen' }
];

function showToast(msg){ 
  state.toast = msg; 
  render(); 
  setTimeout(()=>{ state.toast=null; render(); }, 2000); 
}

/* ============================= CONTROLLER LOGIC ============================= */
function handleFormSubmit(e){
  e.preventDefault();
  const usernameField = document.getElementById('username');
  const passwordField = document.getElementById('password');
  
  const uVal = usernameField.value.trim();
  const pVal = passwordField.value;

  // ตรวจหาข้อมูลพนักงานที่กรอกเข้ามาในฐานข้อมูล
  const matchedUser = USERS.find(user => user.username === uVal && user.password === pVal);

  if (matchedUser) {
    showToast('เข้าสู่ระบบสำเร็จ! กำลังนำทางไปยังหน้าระบบงาน...');
    
    // ย้ายหน้าไปยังบทบาทหน้าที่สอดคล้องตามที่ระบุสิทธิ์โดยอัตโนมัติ
    setTimeout(() => {
      window.location.href = matchedUser.role + '.html';
    }, 1200);
  } else {
    showToast('ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหมี่อีกครั้ง');
    passwordField.value = ''; // เคลียร์รหัสผ่านที่ผิดพลาด
    passwordField.focus();
  }
}

/* ============================= VIEW RENDERING ============================= */
function renderLoginCard(){
  return `
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">🍵</div>
      <h2 class="brand-title">ร้านชาแมกไม้</h2>
      <p class="brand-subtitle">ระบบบริหารจัดการพนักงานหลังบ้าน</p>
    </div>

    <!-- แบบฟอร์มกรอกชื่อผู้ใช้และรหัสผ่าน -->
    <form onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน (Username)</label>
        <input type="text" id="username" class="form-input" placeholder="ป้อนชื่อผู้ใช้งาน" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="password">รหัสผ่าน (Password)</label>
        <input type="password" id="password" class="form-input" placeholder="ป้อนรหัสผ่าน" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
    </form>
    
    <!-- ส่วนแสดงข้อมูลแนะนำสำหรับผู้ทดสอบระบบ -->
    <div style="text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:20px; line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 16px;">
      <div style="font-weight:700; margin-bottom:4px; color:var(--brown-800);">ข้อมูลจำลองสำหรับใช้ทดสอบเข้าระบบ:</div>
      <div>เจ้าของร้าน: <span class="mono">owner</span> / รหัส: <span class="mono">3333</span></div>
      <div>แคชเชียร์: <span class="mono">cashier</span> / รหัส: <span class="mono">1111</span></div>
      <div>พนักงานครัว: <span class="mono">kitchen</span> / รหัส: <span class="mono">2222</span></div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="app-window">
      <div class="app-titlebar">
        <div class="tleft"><span class="dot"></span>CM · เข้าสู่ระบบพนักงาน</div>
        <div class="online">Online</div>
      </div>
      <div class="app-flex">
        ${renderLoginCard()}
      </div>
    </div>
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
  `;
}

render();
</script>
</body>
</html>
