<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ครัว — ร้านชาแมกไม้</title>
  <style>
    :root{--brown-900:#3E2A1E;--brown-800:#5C4030;--cream-100:#FBF5E9;--paper:#fff;--amber:#E28A33;--amber-dark:#C96F1E;--clay:#C9573F;--jade:#3E8E63;--line:#E7DCC9;--ink:#2C2118;--ink-soft:#8A7A67;--shadow:0 16px 40px -24px rgba(62,42,30,.35);}
    *{box-sizing:border-box;} body{margin:0;font-family:'Sarabun',sans-serif;background:linear-gradient(135deg,#fdf7ee 0%,#f7ecdb 100%);color:var(--ink);} a{color:inherit;text-decoration:none;}
    .page{max-width:1200px;margin:0 auto;padding:0 0 20px;}
    .topbar{background:linear-gradient(135deg,var(--brown-800),var(--brown-900));color:#fff;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);margin:0 0 18px;}
    .topbar h1{margin:0;font-size:22px;font-family:'Noto Serif Thai',serif;}
    .topbar p{margin:3px 0 0;font-size:13px;opacity:.9;}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px;}
    .panel{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:320px;box-shadow:var(--shadow);}
    .panel h2{margin:0 0 10px;font-size:18px;color:var(--brown-900);}
    .card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff;box-shadow:0 10px 24px -18px rgba(0,0,0,.28);}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:8px;} .queue{background:#f5e6c6;color:#8a5a16;} .cooking{background:#fbe2d9;color:var(--clay);} .done{background:#e7f3eb;color:var(--jade);} 
    .btn{border:none;border-radius:10px;padding:8px 12px;font-weight:700;color:#fff;margin-top:8px;box-shadow:0 10px 20px -12px rgba(62,42,30,.45);transition:transform .2s ease;} .btn:hover{transform:translateY(-1px);} .btn.queue{background:linear-gradient(135deg,var(--amber),var(--amber-dark));} .btn.cooking{background:linear-gradient(135deg,var(--jade),#2f7a57);} .meta{font-size:13px;color:var(--ink-soft);} 
    @media (max-width:900px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1>ครัว</h1>
        <p>ติดตามออเดอร์จากลูกค้าแบบเรียลไทม์</p>
      </div>
      <a href="index.html" style="background:rgba(255,255,255,.16);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;">กลับหน้าเลือก</a>
    </div>
    <div class="grid">
      <div class="panel"><h2>รอคิว</h2><div id="queue"></div></div>
      <div class="panel"><h2>กำลังทำ</h2><div id="cooking"></div></div>
      <div class="panel"><h2>เสร็จแล้ว</h2><div id="done"></div></div>
    </div>
  </div>
  <script>
    const orders = [
      {id:1, table:5, items:['ชาเขียวมัจฉะ','ไส้กรอกแดง'], status:'queue'},
      {id:2, table:2, items:['มาม่าต้มยำน้ำข้น','ไมโล'], status:'cooking'},
      {id:3, table:8, items:['ชาไทย'], status:'done'},
    ];
    function render(){
      document.getElementById('queue').innerHTML = orders.filter(o=>o.status==='queue').map(o=>`<div class="card"><span class="badge queue">รอคิว</span><div style="font-weight:700;">โต๊ะ ${o.table}</div><div class="meta">${o.items.join(', ')}</div><button class="btn queue" onclick="advance(${o.id})">รับออเดอร์</button></div>`).join('') || '<div class="meta">ไม่มีรายการ</div>';
      document.getElementById('cooking').innerHTML = orders.filter(o=>o.status==='cooking').map(o=>`<div class="card"><span class="badge cooking">กำลังทำ</span><div style="font-weight:700;">โต๊ะ ${o.table}</div><div class="meta">${o.items.join(', ')}</div><button class="btn cooking" onclick="advance(${o.id})">เสร็จแล้ว</button></div>`).join('') || '<div class="meta">ไม่มีรายการ</div>';
      document.getElementById('done').innerHTML = orders.filter(o=>o.status==='done').map(o=>`<div class="card"><span class="badge done">เสร็จแล้ว</span><div style="font-weight:700;">โต๊ะ ${o.table}</div><div class="meta">${o.items.join(', ')}</div></div>`).join('') || '<div class="meta">ไม่มีรายการ</div>';
    }
    function advance(id){ const o = orders.find(x=>x.id===id); if(o.status==='queue') o.status='cooking'; else if(o.status==='cooking') o.status='done'; render(); }
    render();
  </script>
</body>
</html>
